version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jongio/azd-app/cli/src/gen/proto
inputs:
  - directory: proto
plugins:
  # ---- Go side: messages + Connect-Go service stubs ----
  - local: protoc-gen-go
    out: cli/src/gen/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: cli/src/gen/proto
    opt:
      - paths=source_relative

  # ---- TypeScript side: messages + service stubs ----
  # In protoc-gen-es v2, service descriptors are generated alongside messages
  # (no separate protoc-gen-connect-es needed). Run via pnpm exec from
  # cli/dashboard so the local node_modules versions are used.
  - local: protoc-gen-es
    out: cli/dashboard/src/gen/proto
    include_imports: true
    opt:
      - target=ts
      - import_extension=.js
