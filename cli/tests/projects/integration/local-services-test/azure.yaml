# yaml-language-server: $schema=https://raw.githubusercontent.com/jongio/azd-app/main/schemas/v1.1/azure.yaml.json

name: local-services-test
metadata:
  template: local-services-test@0.0.1-alpha

services:
  api:
    project: ./api
    language: python
    host: localhost
    ports:
      - "8001"
    command: python app.py
    environment:
      PORT: "8001"

  web:
    project: ./web
    language: js
    host: localhost
    ports:
      - "3000"
    command: node server.js

  worker:
    project: ./worker
    language: python
    host: localhost
    ports:
      - "8080"
    command: python app.py

