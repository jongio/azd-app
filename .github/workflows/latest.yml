name: Latest Build

# Produces installable binaries from main on every push.
# Downloads are available at: https://github.com/jongio/azd-app/releases/tag/latest

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/latest.yml'
      - 'scripts/publish-latest-release.sh'
      - 'scripts/test-publish-latest-release.sh'
      - 'scripts/testdata/fake-gh.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/latest.yml'
      - 'scripts/publish-latest-release.sh'
      - 'scripts/test-publish-latest-release.sh'
      - 'scripts/testdata/fake-gh.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Latest Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: actionlint -ignore 'unknown permission scope "copilot-requests"'

      - name: Test latest release publisher
        run: bash scripts/test-publish-latest-release.sh

  build:
    name: Build Latest
    if: github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: latest-build
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Build dashboard
        run: |
          cd dashboard
          pnpm install
          pnpm run build

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Install azd extensions
        run: |
          azd extension source add azd --location https://aka.ms/azd/extensions/registry --type url 2>/dev/null || true
          azd extension install microsoft.azd.extensions --source azd

      - name: Build binaries
        run: |
          export EXTENSION_ID="jongio.azd.app"
          export EXTENSION_VERSION="0.0.0-dev.$(date +%Y%m%d).$(echo $GITHUB_SHA | cut -c1-7)"
          azd x build --all

      - name: Package
        run: azd x pack

      - name: Prepare release assets
        run: |
          echo "=== Build output ==="
          find output/ -type f 2>/dev/null || find bin/ -type f 2>/dev/null || echo "No output found"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-release-assets
          path: cli/bin/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Latest
    if: github.event_name != 'pull_request'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: latest-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latest-release-assets
          path: release-assets

      - name: Recover interrupted publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/publish-latest-release.sh recover

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          bash scripts/publish-latest-release.sh publish "${files[@]}"
