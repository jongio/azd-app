name: Update azd-core

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'azd-core version to update to (e.g., v0.5.0)'
        required: true
        type: string
      branch:
        description: 'Existing branch to update. Leave empty to create a new branch and PR.'
        required: false
        type: string
  repository_dispatch:
    types: [azd-core-released]

concurrency:
  group: update-azd-core
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  update:
    name: Update azd-core dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "version=$PAYLOAD_VERSION" >> "$GITHUB_OUTPUT"
            echo "branch=$PAYLOAD_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "branch=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: Validate version
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: version is required"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "ERROR: Version must start with 'v' (e.g., v0.5.0)"
            exit 1
          fi
        working-directory: .

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.inputs.outputs.branch || 'main' }}
          fetch-depth: 0

      - name: Create branch
        if: ${{ !steps.inputs.outputs.branch }}
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          BRANCH="update-azd-core-${VERSION}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
        working-directory: .

      - name: Set branch env
        if: ${{ steps.inputs.outputs.branch }}
        env:
          TARGET_BRANCH: ${{ steps.inputs.outputs.branch }}
        run: |
          echo "BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        working-directory: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Update azd-core
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          GOWORK=off go get "github.com/jongio/azd-core@${VERSION}"
          GOWORK=off go mod tidy

      - name: Commit and push
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          if git diff --quiet HEAD -- go.mod go.sum; then
            echo "Already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: update azd-core to ${VERSION}"
          git push origin "$BRANCH"

      - name: Create PR
        if: ${{ !steps.inputs.outputs.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          gh pr create \
            --title "chore: update azd-core to ${VERSION}" \
            --body "Update azd-core to ${VERSION}"
        working-directory: .
