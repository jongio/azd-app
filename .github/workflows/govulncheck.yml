name: Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    # Allow-list: govulncheck has no built-in ignore file; the recommended approach is
    # to update the affected dependency. If a CVE is not reachable via actual call paths,
    # govulncheck already suppresses it automatically (it only flags called symbols).
    # For advisory-level overrides, create cli/.govulncheck.yaml with an 'exclude' block:
    #
    #   govulncheck:
    #     exclude:
    #       - id: GO-2024-XXXX   # reason: not reachable; tracked in issue #NNN
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        working-directory: cli
        run: govulncheck ./...

  pnpm-audit:
    name: pnpm Dependency Audit
    runs-on: ubuntu-latest
    # Fails on HIGH or CRITICAL advisories (--audit-level=high).
    # Only production dependencies are scanned (--prod); devDependencies are excluded.
    #
    # Allow-list: to suppress a specific advisory that cannot be fixed immediately,
    # add --ignore-cves with the GHSA ID and a tracking comment:
    #
    #   pnpm audit --prod --audit-level=high --ignore-cves GHSA-xxxx-xxxx-xxxx
    #     # reason: only affects build tooling, not shipped code; tracked in issue #NNN
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Install dashboard dependencies
        working-directory: cli/dashboard
        run: pnpm install --frozen-lockfile

      - name: Audit dashboard dependencies
        working-directory: cli/dashboard
        run: pnpm audit --prod --audit-level=high

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit web dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
