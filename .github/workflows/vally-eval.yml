name: Vally Skill Evals

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/src/internal/skills/**'
      - 'cli/evals/**'
      - '.github/workflows/vally-eval.yml'
  schedule:
    # Nightly full eval run at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Eval suite to run'
        required: true
        type: choice
        options:
          - smoke
          - pr
          - routing
          - integration
          - full
        default: smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # copilot-requests lets the built-in GITHUB_TOKEN authenticate against the
  # Copilot API. Without it every eval trial fails with an authorization error.
  copilot-requests: write

defaults:
  run:
    working-directory: cli/evals

jobs:
  eval:
    name: Run Vally Evals (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write

    strategy:
      fail-fast: false
      matrix:
        suite:
          - ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.suite || 'smoke' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run eval suite
        id: eval
        run: |
          ./node_modules/.bin/vally eval \
            --suite ${{ matrix.suite }} \
            --output-dir ./results \
            --output jsonl
        env:
          # Copilot resolves COPILOT_GITHUB_TOKEN ahead of GITHUB_TOKEN, so set
          # both. The copilot-requests permission above is what makes this work.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate eval summary
        if: always()
        run: |
          if [ -f results/eval-results.md ]; then
            echo "## Vally Eval Results (${{ matrix.suite }})" >> $GITHUB_STEP_SUMMARY
            cat results/eval-results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Vally Eval Results" >> $GITHUB_STEP_SUMMARY
            echo "No results file generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vally-eval-results-${{ matrix.suite }}
          path: cli/evals/results/
          retention-days: 30
          if-no-files-found: ignore
